<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- ================================================= -->
    <!-- MAIN GRADIENT                                     -->
    <!-- ================================================= -->

    <linearGradient
      id="mainGradient"
      x1="118"
      y1="62"
      x2="394"
      y2="428"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#28D7F5"/>
      <stop offset="0.34" stop-color="#159AF4"/>
      <stop offset="0.68" stop-color="#5364F1"/>
      <stop offset="1" stop-color="#6139E8"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- DEPTH GRADIENT                                    -->
    <!-- ================================================= -->

    <linearGradient
      id="depthGradient"
      x1="190"
      y1="110"
      x2="430"
      y2="450"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#65D7FA"/>
      <stop offset="0.45" stop-color="#428AF5"/>
      <stop offset="1" stop-color="#4937DE"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- EDGE GRADIENT                                     -->
    <!-- ================================================= -->

    <linearGradient
      id="edgeGradient"
      x1="120"
      y1="80"
      x2="380"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#8AEAFF"/>
      <stop offset="0.45" stop-color="#4E9CF8"/>
      <stop offset="1" stop-color="#493CE4"/>
    </linearGradient>

    <!-- ================================================= -->
    <!-- SOFT SHADOW                                       -->
    <!-- ================================================= -->

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="170%"
      height="190%"
    >
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#07113D"
        flood-opacity="0.28"
      />
    </filter>

    <!-- ================================================= -->
    <!-- INNER GLOW                                        -->
    <!-- ================================================= -->

    <filter
      id="glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur
        stdDeviation="14"
      />
    </filter>

    <!-- ================================================= -->
    <!-- CARD GEOMETRY                                     -->
    <!-- ================================================= -->

    <path
      id="card"
      d="
        M157 62
        C127 62 105 79 97 107
        C91 128 94 154 96 177
        C98 193 98 208 98 224
        V324

        C98 359 119 381 153 386

        C186 391 220 390 256 390
        C292 390 326 391 359 386

        C393 381 414 359 414 324

        V224

        C414 208 414 193 416 177
        C418 154 421 128 415 107

        C407 79 385 62 355 62

        Z
      "
    />

    <!-- ================================================= -->
    <!-- CHECK MASK                                        -->
    <!-- ================================================= -->

    <linearGradient
      id="checkGradient"
      x1="155"
      y1="270"
      x2="345"
      y2="155"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5FDFF"/>
    </linearGradient>

  </defs>


  <!-- =================================================== -->
  <!-- ICON                                                -->
  <!-- =================================================== -->

  <g transform="rotate(-6 256 256)">

    <!-- ================================================ -->
    <!-- BACK DEPTH — FAR                                 -->
    <!-- ================================================ -->

    <g transform="translate(64 66)">
      <use
        href="#card"
        fill="url(#depthGradient)"
      />
    </g>


    <!-- ================================================ -->
    <!-- BACK DEPTH — MID                                 -->
    <!-- ================================================ -->

    <g transform="translate(42 43)">
      <use
        href="#card"
        fill="url(#depthGradient)"
      />
    </g>


    <!-- ================================================ -->
    <!-- BACK DEPTH — NEAR                                -->
    <!-- ================================================ -->

    <g transform="translate(21 21)">
      <use
        href="#card"
        fill="url(#edgeGradient)"
      />
    </g>


    <!-- ================================================ -->
    <!-- MAIN SHADOW                                       -->
    <!-- ================================================ -->

    <use
      href="#card"
      fill="#08133D"
      filter="url(#shadow)"
    />


    <!-- ================================================ -->
    <!-- MAIN CARD                                         -->
    <!-- ================================================ -->

    <use
      href="#card"
      fill="url(#mainGradient)"
    />


    <!-- ================================================ -->
    <!-- TOP LIGHT                                         -->
    <!-- ================================================ -->

    <path
      d="
        M157 62
        H355
        C385 62 407 79 415 107
        C419 124 418 141 416 155

        C342 132 218 125 96 154

        C94 139 93 122 97 107

        C105 79 127 62 157 62
        Z
      "
      fill="white"
      opacity="0.07"
    />


    <!-- ================================================ -->
    <!-- SUBTLE INNER GLOW                                -->
    <!-- ================================================ -->

    <path
      d="
        M143 88
        C124 90 113 103 108 122
        C103 143 106 166 107 185
        V321
        C107 346 122 361 148 365
      "
      stroke="white"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.10"
    />


    <!-- ================================================ -->
    <!-- CHECK GLOW                                        -->
    <!-- ================================================ -->

    <path
      d="
        M153 229
        L218 294
        L347 151
      "
      stroke="white"
      stroke-width="43"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.12"
      filter="url(#glow)"
    />


    <!-- ================================================ -->
    <!-- CHECK MARK                                        -->
    <!-- ================================================ -->

    <path
      d="
        M153 229
        L218 294
        L347 151
      "
      stroke="url(#checkGradient)"
      stroke-width="31"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </g>

</svg>
